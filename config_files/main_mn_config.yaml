# Main configuration script for the SpaceNet Mininet Simulator
ConstellationName: starlink1440_15_10 # Name must match constellation config file (fakelink6_10_2, onefib66_30_18, starlink72_1_10, starlink72_30_29)
OutputFilePath: /home/spacenet/simulator/dynamic-topology-generator/output
TLEFilePath: /home/spacenet/simulator/dynamic-topology-generator/utils/
DeleteAppResults: False
Verbose: True
# App configurations
AppName: Ping # Options- Ping, iPerf, CLI
# For Ping and iPerf
# Useable keywords- firstGS, lastGS, firstSat, lastSat
SourceDeviceName: firstGS
DestDeviceName: lastGS
# For CLI
CLIStartInterval: 0
CLIIntervalCount: 0
