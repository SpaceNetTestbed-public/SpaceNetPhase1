# Template for constellation configurations
# Default constellation naming convention: <constellation_name><sat_count>_<interval_duration>_<interval_count>.yaml
# Configuration for <Constellation_name>

Sim_Length: # options for simulation length
    TimeStepDuration: <interval_duration>
    TimeStepCount: <interval_count>
Sim_Date_Time: # options for simulation starting date & time (testbed will also look for TLE with timestamp closest to this date/time)
    StartYear: <TLE_start_year>
    StartMonth: <TLE_start_month>
    StartDay: <TLE_start_day>
    StartHour: <TLE_start_hour>
    StartMinute: <TLE_start_minute>
    StartSecond: <TLE_start_second>

generate_TLE: false # true/false (if true, will generate TLEs based on following parameters; use false if providing pre-generated TLEs)
# Constellation Parameters
# (if generating TLEs, parameters are used to define constellation; if providing TLE, parameters are used to select relevant sats):
shells:
    shell1: # if using multiple shells, copy and paste this parameter range and rename 'shell1' to 'shell2', 'shell3', etc.
        name: shell1
        orbits: <number_of_orbits>
        sat_per_orbit: <number_of_sats_per_orbit>   # total number of sats = orbits*sat_per_orbit
        altitude: <operating geodetic altitude>     # altitude in km
        inclination: <inclination of shell>         # inclination in degrees
        pattern: walker_delta                       # options: 'walker_delta' (default), 'walker_star'
        ipp_increment: 1
        body: <Celestial body>                      # Primary body (current options: Earth/Moon)
        perturber: <Third body>                     # Leave blank if body=Earth

# TLE file directory (UNCOMMENT if you have a custom location for your TLE)
# TLEFilePath: utils/myTLE_path/